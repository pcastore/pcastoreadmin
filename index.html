<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PCA Game Store — Admin Panel</title>
<style>
:root{
  --bg:#18191A;
  --surface:#242526;
  --surface-2:#3A3B3C;
  --surface-3:#4A4B4D;
  --blue:#2374E1;
  --blue-soft:rgba(35,116,225,.15);
  --gold:#F7B733;
  --gold-soft:rgba(247,183,51,.15);
  --green:#42B72A;
  --green-soft:rgba(66,183,42,.15);
  --red:#F02849;
  --red-soft:rgba(240,40,73,.15);
  --text:#E4E6EB;
  --text-dim:#B0B3B8;
  --text-faint:#767980;
  --border:#3E4042;
  --radius:14px;
  font-size:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Helvetica,Arial,"Padauk","Myanmar Text",sans-serif;
}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
button{font-family:inherit;}

/* ---------- APP SHELL ---------- */
.app{min-height:100vh;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 18px;
}
.brand{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;}
.brand .icon{width:20px;height:20px;color:var(--gold);}
.brand span{font-weight:600;color:var(--text-faint);font-size:12.5px;margin-left:4px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
#adminEmail{font-size:12px;color:var(--text-faint);}
.btn-ghost{
  background:var(--surface-2);color:var(--text);border:none;border-radius:9px;
  padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.btn-ghost:hover{background:var(--surface-3);}

.tabs{
  display:flex;gap:4px;padding:10px 14px 0;background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.tab{
  background:none;border:none;color:var(--text-faint);padding:10px 14px;font-size:13px;font-weight:700;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.tab.active{color:var(--text);border-bottom-color:var(--blue);}
.tab-badge{
  background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:10px;
  padding:1px 6px;min-width:16px;text-align:center;
}
.content{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ---------- OVERVIEW ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-card .v{font-size:22px;font-weight:800;}
.stat-card .l{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.stat-card .icon{color:var(--blue);margin-bottom:8px;}

/* ---------- FILTER CHIPS ---------- */
.chip-filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
.chip{
  background:var(--surface-2);border:1px solid transparent;color:var(--text-dim);
  border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--blue-soft);color:var(--blue);border-color:var(--blue);}

/* ---------- DATA LIST / CARDS ---------- */
.data-list{display:flex;flex-direction:column;gap:10px;}
.data-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
}
.data-card .main{flex:1;min-width:180px;}
.data-card .title{font-size:14px;font-weight:700;}
.data-card .sub{font-size:12px;color:var(--text-faint);margin-top:3px;line-height:1.5;}
.data-card .amt{font-size:15px;font-weight:800;white-space:nowrap;}
.data-card .amt.pos{color:var(--green);}
.data-card .amt.neg{color:var(--text);}
.pill{
  font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:12px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.pill.pending{background:var(--gold-soft);color:var(--gold);}
.pill.done, .pill.fulfilled{background:var(--green-soft);color:var(--green);}
.pill.cancelled, .pill.rejected{background:var(--red-soft);color:var(--red);}
.data-card .actions{display:flex;gap:8px;width:100%;margin-top:4px;}
.btn-sm{
  border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;flex:1;
}
.btn-approve{background:var(--green);color:#fff;}
.btn-reject{background:var(--surface-2);color:var(--red);}
.btn-view{background:var(--surface-2);color:var(--text);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);font-size:13px;}
.receipt-thumb{
  width:44px;height:44px;border-radius:8px;object-fit:cover;cursor:pointer;border:1px solid var(--border);
}

/* ---------- CATALOG ---------- */
.catalog-subtabs{display:flex;gap:8px;margin-bottom:14px;}
.subtab{
  background:var(--surface-2);border:none;color:var(--text-dim);border-radius:9px;
  padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
}
.subtab.active{background:var(--blue);color:#fff;}
.catalog-toolbar{display:flex;justify-content:flex-end;margin-bottom:14px;}
.btn-primary{
  background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 16px;
  font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.catalog-item-icon{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.catalog-item-icon .icon{width:18px;height:18px;color:#fff;}
.icon-edit, .icon-del{
  background:var(--surface-2);border:none;color:var(--text-dim);border-radius:8px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.icon-del:hover{color:var(--red);}

/* ---------- LEADERBOARD ---------- */
.rank-row{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 16px;
}
.rank-num{width:22px;text-align:center;font-weight:800;color:var(--text-faint);}
.rank-ava{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
}
.rank-info{flex:1;}
.rank-info .n{font-size:13.5px;font-weight:700;}
.rank-val{font-size:13.5px;font-weight:800;color:var(--gold);white-space:nowrap;}

/* ---------- OVERLAY / MODAL ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:92%;max-width:420px;
  background:var(--surface);border-radius:var(--radius);z-index:50;opacity:0;pointer-events:none;
  transition:all .2s;max-height:86vh;display:flex;flex-direction:column;
}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--border);font-size:15px;font-weight:800;
}
.modal-header button{background:none;border:none;color:var(--text-faint);cursor:pointer;}
.modal-body{padding:18px;overflow-y:auto;}
.form-group{margin-bottom:14px;}
.form-label{font-size:12px;color:var(--text-faint);margin-bottom:6px;display:block;font-weight:600;}
.form-input, .form-select, textarea.form-input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:11px 13px;font-size:13.5px;outline:none;font-family:inherit;
}
.form-input:focus, .form-select:focus{border-color:var(--blue);}
.form-row{display:flex;gap:10px;}
.form-row .form-group{flex:1;}
.form-check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;}
.icon-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.icon-picker button{
  background:var(--surface-2);border:2px solid transparent;border-radius:9px;height:38px;
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;
}
.icon-picker button.selected{border-color:var(--blue);color:var(--blue);}
.modal-confirm{
  width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px;
  font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;
}
.modal-danger{
  width:100%;background:none;color:var(--red);border:1px solid var(--red);border-radius:10px;padding:12px;
  font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;
}

/* ---------- LIGHTBOX ---------- */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:none;
  align-items:center;justify-content:center;padding:24px;
}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);background:var(--surface-3);
  color:var(--text);padding:12px 18px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:8px;
  z-index:70;transition:bottom .25s;box-shadow:0 6px 20px rgba(0,0,0,.3);
}
.toast.show{bottom:24px;}

@media (max-width:600px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .data-card .actions{flex-direction:row;}
}
</style>
</head>

<!-- ================= APP ================= -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><svg class="icon"><use href="#i-coin"></use></svg> PCA Game Store <span>Admin</span></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview"><svg class="icon" style="width:15px;height:15px"><use href="#i-home"></use></svg> Overview</button>
    <button class="tab" data-tab="orders"><svg class="icon" style="width:15px;height:15px"><use href="#i-receipt"></use></svg> Orders <span class="tab-badge" id="ordersBadge" style="display:none"></span></button>
    <button class="tab" data-tab="topups"><svg class="icon" style="width:15px;height:15px"><use href="#i-wallet"></use></svg> Top-ups <span class="tab-badge" id="topupsBadge" style="display:none"></span></button>
    <button class="tab" data-tab="catalog"><svg class="icon" style="width:15px;height:15px"><use href="#i-image"></use></svg> Catalog</button>
    <button class="tab" data-tab="leaderboard"><svg class="icon" style="width:15px;height:15px"><use href="#i-trophy"></use></svg> Leaderboard</button>
    <button class="tab" data-tab="users"><svg class="icon" style="width:15px;height:15px"><use href="#i-user"></use></svg> Users</button>
  </nav>

  <main class="content">

    <!-- OVERVIEW -->
    <section class="tab-panel active" id="tab-overview">
      <div class="stat-grid">
        <div class="stat-card"><svg class="icon"><use href="#i-receipt"></use></svg><div class="v" id="statPendingOrders">—</div><div class="l">Pending orders</div></div>
        <div class="stat-card"><svg class="icon"><use href="#i-wallet"></use></svg><div class="v" id="statPendingTopups">—</div><div class="l">Pending top-ups</div></div>
        <div class="stat-card"><svg class="icon"><use href="#i-coin"></use></svg><div class="v" id="statTodayRevenue">—</div><div class="l">Approved today (Ks)</div></div>
        <div class="stat-card"><svg class="icon"><use href="#i-user"></use></svg><div class="v" id="statTotalUsers">—</div><div class="l">Customers</div></div>
      </div>
      <div class="section-title" style="margin:20px 0 10px;font-size:13px;color:var(--text-faint);font-weight:700;">Revenue — last 7 days (Ks)</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:flex-end;gap:8px;height:180px;" id="revenueChart"></div>
    </section>

    <!-- ORDERS -->
    <section class="tab-panel" id="tab-orders">
      <div class="chip-filters" id="orderFilters">
        <button class="chip active" data-filter="pending">Pending</button>
        <button class="chip" data-filter="fulfilled">Fulfilled</button>
        <button class="chip" data-filter="cancelled">Cancelled</button>
        <button class="chip" data-filter="all">All</button>
      </div>
      <div class="catalog-toolbar"><button class="btn-ghost" id="exportOrdersBtn"><svg class="icon" style="width:14px;height:14px"><use href="#i-receipt"></use></svg> Export CSV</button></div>
      <div class="data-list" id="ordersList"></div>
    </section>

    <!-- TOP-UPS -->
    <section class="tab-panel" id="tab-topups">
      <div class="chip-filters" id="topupFilters">
        <button class="chip active" data-filter="pending">Pending</button>
        <button class="chip" data-filter="done">Done</button>
        <button class="chip" data-filter="rejected">Rejected</button>
        <button class="chip" data-filter="all">All</button>
      </div>
      <div class="catalog-toolbar"><button class="btn-ghost" id="exportTopupsBtn"><svg class="icon" style="width:14px;height:14px"><use href="#i-wallet"></use></svg> Export CSV</button></div>
      <div class="data-list" id="topupsList"></div>
    </section>

    <!-- CATALOG -->
    <section class="tab-panel" id="tab-catalog">
      <div class="catalog-subtabs" id="catalogSubtabs">
        <button class="subtab active" data-cat="games">Games</button>
        <button class="subtab" data-cat="packages">Packages</button>
        <button class="subtab" data-cat="payments">Payment Methods</button>
        <button class="subtab" data-cat="bullets">Bullet Chat</button>
      </div>
      <div class="catalog-toolbar" style="justify-content:space-between;">
        <button class="btn-ghost" id="importDefaultsBtn"><svg class="icon" style="width:14px;height:14px"><use href="#i-download"></use></svg> Import Store Defaults</button>
        <button class="btn-primary" id="addCatalogBtn"><svg class="icon" style="width:14px;height:14px"><use href="#i-plus"></use></svg> Add</button>
      </div>
      <div class="data-list" id="catalogList"></div>
    </section>

    <!-- LEADERBOARD -->
    <section class="tab-panel" id="tab-leaderboard">
      <div class="catalog-toolbar" style="justify-content:flex-end;">
        <button class="btn-ghost" id="clearLeaderboardBtn" style="color:var(--red);"><svg class="icon" style="width:14px;height:14px"><use href="#i-x"></use></svg> Clear All</button>
      </div>
      <div class="data-list" id="leaderboardList"></div>
    </section>

    <!-- USERS -->
    <section class="tab-panel" id="tab-users">
      <div class="form-group"><input class="form-input" id="userSearchInput" placeholder="Search name / phone / email"></div>
      <div class="chip-filters" id="userFilters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="linked">Google Linked</button>
        <button class="chip" data-filter="guest">Guest</button>
      </div>
      <div class="data-list" id="usersList"></div>
    </section>

  </main>
</div>

  <div class="modal-body" id="catalogModalBody"></div>
</div>

<script>
/* =========================================================
   FIREBASE CONFIG
   ---------------------------------------------------------
   ဒီနေရာမှာ game-store.html အတွက် သုံးထားတဲ့ Firebase project
   config အတူတူကို ကူးထည့်ပါ — data တွေ အားလုံး project တစ်ခုတည်း
   ထဲမှာသာ ရှိတာမို့ project မတူရင် ဒီ admin panel က ဘာမှမမြင်ရပါ။
   ========================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================================================
   TELEGRAM (send approval/rejection messages to the customer)
   ---------------------------------------------------------
   Use the SAME bot token as game-store.html. The customer's chat id
   comes from the "Telegram Chat ID" field they fill in their profile
   (Profile > Edit > Telegram Chat ID in the store app).
   ========================================================= */
const TELEGRAM_BOT_TOKEN = "YOUR_BOT_TOKEN";
function notifyTelegramCustomer(chatId, text){
  if(!chatId || !TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN") return;
  fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ chat_id: chatId, text, parse_mode:"HTML" })
  }).catch(err=>console.error("Telegram notify failed", err));
}

function getAdminName(){

    localStorage.setItem("cb_admin_name", name);

}
function logActivity(action, detail){

  }).catch(err=>console.error("Activity log failed", err));

function icon(name, px){
  const size = px ? ` style="width:${px}px;height:${px}px"` : "";
  return `<svg class="icon"${size}><use href="#i-${name}"></use></svg>`;
}
function fmt(n){ return (n||0).toLocaleString("en-US"); }
function fmtDate(ts){
  if(!ts || typeof ts.toDate !== "function") return "—";
  return ts.toDate().toLocaleString("en-US", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
}
let toastTimer=null;
function showToast(msg, iconName){
  const el = document.getElementById("toast");
  el.innerHTML = `${icon(iconName||"check-circle",16)}<span>${msg}</span>`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}

document.getElementById("ordersList").addEventListener("click", async e=>{
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const order = allOrders.find(o=>o.id===btn.dataset.id);
  if(!order) return;
  btn.disabled = true;
  try{
    const userSnap = await db.collection("users").doc(order.uid).get();
    const chatId = userSnap.exists ? userSnap.data().telegramChatId : null;
    if(btn.dataset.act === "fulfill"){
      await db.collection("orders").doc(order.id).update({status:"fulfilled"});
      if(order.txId){
        await db.collection("users").doc(order.uid).collection("transactions").doc(order.txId).update({status:"done"});
      }
      logActivity("fulfill_order", `${order.game} — ${order.pkgLabel} (${fmt(order.price)} Ks)`);
      notifyTelegramCustomer(chatId, `✅ Your order <b>${order.game} — ${order.pkgLabel}</b> has been delivered. Thanks for shopping with PCA Game Store!`);
      showToast("Order marked fulfilled", "check-circle");
    }else if(btn.dataset.act === "cancel"){
      const userRef = db.collection("users").doc(order.uid);
      const orderRef = db.collection("orders").doc(order.id);
      await db.runTransaction(async tx=>{
        tx.update(orderRef, {status:"cancelled"});
        tx.update(userRef, {balance: firebase.firestore.FieldValue.increment(order.price||0)});
        if(order.txId){
          tx.update(userRef.collection("transactions").doc(order.txId), {status:"cancelled"});
        }
      });
      logActivity("cancel_order", `${order.game} — ${order.pkgLabel}, refunded ${fmt(order.price)} Ks`);
      notifyTelegramCustomer(chatId, `⚠️ Your order <b>${order.game} — ${order.pkgLabel}</b> was cancelled and ${fmt(order.price)} Ks was refunded to your wallet.`);
      showToast(`Order cancelled, ${fmt(order.price)} Ks refunded`, "check-circle");
    }
  }catch(err){ console.error(err); showToast("Action failed: "+err.message, "alert"); }
  finally{ btn.disabled = false; }
});

/* ---------- REVENUE CHART (last 7 days, from approved top-ups) ---------- */
function renderRevenueChart(){
  const el = document.getElementById("revenueChart");
  if(!el) return;
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    days.push(d);
  }
  const totals = days.map(day=>{
    const next = new Date(day); next.setDate(next.getDate()+1);
    return allTopups
      .filter(x=>x.status==="done" && x.createdAt && x.createdAt.toDate()>=day && x.createdAt.toDate()<next)
      .reduce((sum,x)=>sum+(x.amount||0), 0);
  });
  const max = Math.max(...totals, 1);
  el.innerHTML = days.map((day,i)=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:10px;color:var(--text-faint);">${fmt(totals[i])}</div>
      <div style="width:100%;background:var(--blue);border-radius:4px 4px 0 0;height:${Math.max(4,(totals[i]/max)*120)}px;"></div>
      <div style="font-size:10px;color:var(--text-faint);">${day.toLocaleDateString("en-US",{weekday:"short"})}</div>
    </div>`).join("");
}

async function importCatalogDefaults(){
  const btn = document.getElementById("importDefaultsBtn");
  btn.disabled = true;
  try{
    const sources = { games: DEFAULT_GAMES, packages: DEFAULT_PACKAGES, payments: DEFAULT_PAYMENTS };
    let added = 0;
    for(const col of Object.keys(sources)){
      const snap = await db.collection(col).get();
      const existingIds = new Set(snap.docs.map(d=>d.id));
      const batch = db.batch();
      let batchCount = 0;
      sources[col].forEach(item=>{
        if(!existingIds.has(item.id)){ batch.set(db.collection(col).doc(item.id), item); batchCount++; }
      });
      if(batchCount){ await batch.commit(); added += batchCount; }
    }
    showToast(added ? `Imported ${added} item(s) — now editable below` : "Everything is already imported", "check-circle");
    if(added) logActivity("import_defaults", `${added} item(s)`);
  }catch(err){ console.error(err); showToast("Import failed: "+err.message, "alert"); }
  finally{ btn.disabled = false; }
}

function openCatalogModal(type, item){
  const isEdit = !!item;
  document.getElementById("catalogModalTitle").textContent = (isEdit?"Edit ":"Add ") + type.slice(0,-1);
  const body = document.getElementById("catalogModalBody");

  if(type === "games"){
    body.innerHTML = `
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="fName" value="${item?.name||""}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Short badge (2-3 letters)</label><input class="form-input" id="fShort" maxlength="3" value="${item?.short||""}"></div>
        <div class="form-group"><label class="form-label">Color</label><input class="form-input" id="fColor" type="color" value="${item?.color||"#2374E1"}" style="height:42px;padding:4px;"></div>
      </div>
      <div class="form-group"><label class="form-label">Icon image URL (optional — shows a real logo instead of the placeholder icon)</label><input class="form-input" id="fImage" value="${item?.image||""}" placeholder="https://..."></div>
      <div class="form-group"><label class="form-label">Description (shown on the game page)</label><textarea class="form-input" id="fDesc" rows="2">${item?.desc||""}</textarea></div>
      <div class="form-check"><input type="checkbox" id="fNeedsServer" ${item?.needsServerId?"checked":""}> <span>Needs a Server / Zone ID at checkout</span></div>
      <button class="modal-confirm" id="catalogSaveBtn">Save</button>`;
  }else if(type === "packages"){
    const gameOptions = catalogData.games.map(g=>`<option value="${g.name}" ${item?.game===g.name?"selected":""}>${g.name}</option>`).join("");
    body.innerHTML = `
      <div class="form-group"><label class="form-label">Game</label><select class="form-select" id="fGame">${gameOptions || '<option value="">Add a game first</option>'}</select></div>
      <div class="form-group"><label class="form-label">Package label (e.g. "310 Diamonds")</label><input class="form-input" id="fLabel" value="${item?.label||""}"></div>
      <div class="form-group"><label class="form-label">Subtitle</label><input class="form-input" id="fSub" value="${item?.sub||""}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Price (Ks)</label><input class="form-input" id="fPrice" value="${item?.price||""}"></div>
        <div class="form-group"><label class="form-label">Was (optional)</label><input class="form-input" id="fOld" value="${item?.old||""}"></div>
      </div>
      <div class="form-group"><label class="form-label">Icon</label>${iconPickerHtml(item?.icon||"diamond")}</div>
      <div class="form-check"><input type="checkbox" id="fBest" ${item?.best?"checked":""}> <span>Mark as best-seller</span></div>
      <button class="modal-confirm" id="catalogSaveBtn">Save</button>`;
  }else if(type === "bullets"){
    body.innerHTML = `
      <div class="form-group"><label class="form-label">Display name (shown in the ticker)</label><input class="form-input" id="fName" value="${item?.name||""}" placeholder="e.g. Aung K."></div>
      <div class="form-group"><label class="form-label">Activity text</label><input class="form-input" id="fAction" value="${item?.action||""}" placeholder="e.g. Free Fire အတွက် Diamonds ဝယ်ယူခဲ့သည်"></div>
      <div class="form-group"><label class="form-label">Avatar color</label><input class="form-input" id="fColor" type="color" value="${item?.color||"#2374E1"}" style="height:42px;padding:4px;"></div>
      <button class="modal-confirm" id="catalogSaveBtn">Save</button>`;
  }else{
    body.innerHTML = `
      <div class="form-group"><label class="form-label">Method name (e.g. "KBZPay")</label><input class="form-input" id="fLabel" value="${item?.label||""}"></div>
      <div class="form-group"><label class="form-label">Subtitle</label><input class="form-input" id="fSub" value="${item?.sub||""}"></div>
      <div class="form-group"><label class="form-label">Icon</label>${iconPickerHtml(item?.icon||"card")}</div>
      <div class="form-group"><label class="form-label">Admin name shown to customers</label><input class="form-input" id="fAdminName" value="${item?.adminName||""}"></div>
      <div class="form-group"><label class="form-label">Admin phone number</label><input class="form-input" id="fAdminPhone" value="${item?.adminPhone||""}"></div>
      <button class="modal-confirm" id="catalogSaveBtn">Save</button>`;
  }

  body.querySelectorAll(".icon-picker button").forEach(b=>{
    b.addEventListener("click", ()=>{
      body.querySelectorAll(".icon-picker button").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
    });
  });

  document.getElementById("catalogSaveBtn").addEventListener("click", async ()=>{
    const saveBtn = document.getElementById("catalogSaveBtn");
    saveBtn.disabled = true;
    try{
      let data, id;
      if(type === "games"){
        const name = document.getElementById("fName").value.trim();
        if(!name){ showToast("Name is required","alert"); return; }
        id = item?.id || slugify(name);
        data = {
          id, name,
          short: document.getElementById("fShort").value.trim().toUpperCase() || name.slice(0,2).toUpperCase(),
          color: document.getElementById("fColor").value,
          image: document.getElementById("fImage").value.trim() || null,
          needsServerId: document.getElementById("fNeedsServer").checked,
          desc: document.getElementById("fDesc").value.trim()
        };
      }else if(type === "packages"){
        const label = document.getElementById("fLabel").value.trim();
        const game = document.getElementById("fGame").value;
        if(!label || !game){ showToast("Game and label are required","alert"); return; }
        id = item?.id || slugify(game+"-"+label);
        data = {
          id, game, label,
          sub: document.getElementById("fSub").value.trim(),
          price: document.getElementById("fPrice").value.trim(),
          old: document.getElementById("fOld").value.trim() || null,
          icon: body.querySelector(".icon-picker .selected")?.dataset.icon || "diamond",
          best: document.getElementById("fBest").checked
        };
      }else if(type === "bullets"){
        const name = document.getElementById("fName").value.trim();
        const action = document.getElementById("fAction").value.trim();
        if(!name || !action){ showToast("Name and activity text are required","alert"); return; }
        id = item?.id || slugify(name+"-"+Date.now());
        data = {
          id, name, action,
          color: document.getElementById("fColor").value
        };
      }else{
        const label = document.getElementById("fLabel").value.trim();
        if(!label){ showToast("Method name is required","alert"); return; }
        id = item?.id || slugify(label);
        data = {
          id, label,
          sub: document.getElementById("fSub").value.trim(),
          icon: body.querySelector(".icon-picker .selected")?.dataset.icon || "card",
          adminName: document.getElementById("fAdminName").value.trim(),
          adminPhone: document.getElementById("fAdminPhone").value.trim()
        };
      }
      await db.collection(type).doc(id).set(data, {merge:true});
      logActivity((item?"edit_":"add_")+type.slice(0,-1), data.name||data.label);
      closeCatalogModal();
      showToast("Saved", "check-circle");
    }catch(err){ console.error(err); showToast("Save failed: "+err.message, "alert"); }
    finally{ saveBtn.disabled = false; }
  });

  catalogModal.classList.add("show");
  overlay.classList.add("show");
}

/* ================= LEADERBOARD ================= */
let allLeaders = [];
async function migrateLeaderboardTotals(){
  try{
    const snap = await db.collection("leaderboard").get();
    const batch = db.batch();
    let count = 0;
    snap.docs.forEach(d=>{
      const data = d.data();
      if(data.total === undefined){
        batch.set(d.ref, { total: (data.spent||0) + (data.toppedUp||0) }, {merge:true});
        count++;
      }
    });
    if(count) await batch.commit();
  }catch(err){ console.error("Leaderboard total migration failed", err); }
}
function bindLeaderboard(){
  if(unsubLeaderboard) unsubLeaderboard();
  unsubLeaderboard = db.collection("leaderboard").orderBy("total","desc").limit(50)
    .onSnapshot(snap=>{
      allLeaders = snap.docs.map(d=>Object.assign({uid:d.id}, d.data()));
      const el = document.getElementById("leaderboardList");
      if(!allLeaders.length){ el.innerHTML = `<div class="empty-state">No spending recorded yet.</div>`; return; }
      el.innerHTML = allLeaders.map((l,i)=>`
        <div class="rank-row">
          <div class="rank-num">${i+1}</div>
          <div class="rank-ava" style="background:linear-gradient(135deg,#2374E1,#00000066)">${l.ava||"?"}</div>
          <div class="rank-info">
            <div class="n">${l.name||"Player"}</div>
            <div style="font-size:11px;color:var(--text-faint);margin-top:2px;">Bought ${fmt(l.spent||0)} · Topped up ${fmt(l.toppedUp||0)}</div>
          </div>
          <div class="rank-val">${fmt(l.total||0)} Ks</div>
          <button class="icon-del" data-uid="${l.uid}" title="Remove from leaderboard">${icon("x",15)}</button>
        </div>`).join("");
    }, err=>console.error(err));
}
document.getElementById("leaderboardList").addEventListener("click", async e=>{
  const btn = e.target.closest("button[data-uid]");
  if(!btn) return;
  const l = allLeaders.find(x=>x.uid===btn.dataset.uid);
  if(!confirm(`Remove "${l?.name||"this entry"}" from the leaderboard?`)) return;
  try{ await db.collection("leaderboard").doc(btn.dataset.uid).delete(); showToast("Removed", "check-circle"); }
  catch(err){ showToast("Remove failed: "+err.message, "alert"); }
});
document.getElementById("clearLeaderboardBtn").addEventListener("click", async ()=>{
  if(!allLeaders.length){ showToast("Leaderboard is already empty", "check-circle"); return; }
  if(!confirm(`Clear all ${allLeaders.length} leaderboard entries? This can't be undone.`)) return;
  const btn = document.getElementById("clearLeaderboardBtn");
  btn.disabled = true;
  try{
    const batch = db.batch();
    allLeaders.forEach(l=>batch.delete(db.collection("leaderboard").doc(l.uid)));
    await batch.commit();
    logActivity("clear_leaderboard", `${allLeaders.length} entries`);
    showToast("Leaderboard cleared", "check-circle");
  }catch(err){ showToast("Clear failed: "+err.message, "alert"); }
  finally{ btn.disabled = false; }
});

/* ================= USERS ================= */
let allUsers = [];
let userFilter = "all";
let userSearch = "";
function bindUsers(){
  if(unsubUsers) unsubUsers();
  unsubUsers = db.collection("users").orderBy("createdAt","desc").limit(300)
    .onSnapshot(snap=>{
      allUsers = snap.docs.map(d=>Object.assign({uid:d.id}, d.data()));
      document.getElementById("statTotalUsers").textContent = snap.size;
      renderUsers();
    }, err=>console.error("users listener error", err));
}
function renderUsers(){
  const el = document.getElementById("usersList");
  let list = allUsers;
  if(userFilter === "linked") list = list.filter(u=>u.googleLinked);
  else if(userFilter === "guest") list = list.filter(u=>!u.googleLinked);
  if(userSearch){
    const q = userSearch.toLowerCase();
    list = list.filter(u=>
      (u.name||"").toLowerCase().includes(q) ||
      (u.phone||"").toLowerCase().includes(q) ||
      (u.email||"").toLowerCase().includes(q)
    );
  }
  if(!list.length){ el.innerHTML = `<div class="empty-state">No users found.</div>`; return; }
  el.innerHTML = list.map(u=>`
    <div class="data-card">
      <div class="rank-ava" style="background:linear-gradient(135deg,#2374E1,#00000066)">${(u.initials||"U")}</div>
      <div class="main">
        <div class="title">${u.name || "User"}</div>
        <div class="sub">${[u.phone, u.email].filter(Boolean).join(" · ") || "—"} · Joined ${fmtDate(u.createdAt)}</div>
      </div>
      <div class="amt">${fmt(u.balance)} Ks</div>
      <span class="pill ${u.googleLinked ? "done" : "pending"}">${u.googleLinked ? "Google" : "Guest"}</span>
    </div>`).join("");
}
document.getElementById("userFilters").addEventListener("click", e=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  document.querySelectorAll("#userFilters .chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  userFilter = chip.dataset.filter;
  renderUsers();
});
document.getElementById("userSearchInput").addEventListener("input", e=>{
  userSearch = e.target.value.trim();
  renderUsers();
});

/* ================= CSV EXPORT ================= */
function downloadCsv(filename, rows){
  const esc = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = rows.map(r=>r.map(esc).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById("exportOrdersBtn").addEventListener("click", ()=>{
  const list = orderFilter==="all" ? allOrders : allOrders.filter(o=>o.status===orderFilter);
  const rows = [["Game","Package","Player ID","Server ID","Price (Ks)","Status","Date"]];
  list.forEach(o=>rows.push([o.game,o.pkgLabel,o.playerId,o.serverId||"",o.price,o.status,fmtDate(o.createdAt)]));
  downloadCsv(`orders-${orderFilter}-${Date.now()}.csv`, rows);
});
document.getElementById("exportTopupsBtn").addEventListener("click", ()=>{
  const list = topupFilter==="all" ? allTopups : allTopups.filter(x=>x.status===topupFilter);
  const rows = [["Method","Amount (Ks)","Status","Date"]];
  list.forEach(x=>rows.push([x.method,x.amount,x.status,fmtDate(x.createdAt)]));
  downloadCsv(`topups-${topupFilter}-${Date.now()}.csv`, rows);
});
